name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Failures as annotations too: they can be read through the API where the logs cannot.
      - run: pnpm --filter @gs1-label-studio/core exec vitest run --reporter=default --reporter=github-actions
        env:
          LABELARY: "1"   # ZPL rendered by labelary.com and read back (packages/core/test/labelary.test.ts)
      - run: pnpm build
      # The editor in a browser (apps/web/e2e), desktop and phone widths, against the build above.
      - run: pnpm --filter @gs1-label-studio/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gs1-label-studio/web e2e
        env:
          CI: "1"
